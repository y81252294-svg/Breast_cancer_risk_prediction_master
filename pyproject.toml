[project]
name = "breast-cancer-risk-prediction"
version = "0.1.0"
description = "Educational breast cancer risk prediction demo"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "joblib>=1.4.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.36.0",
]

[tool.vercel]
entrypoint = "api.index:app"
